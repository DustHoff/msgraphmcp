name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

# Opt into Node.js 24 for all actions (avoids the Node.js 20 deprecation warning)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Actions are pinned to commit SHAs (audit CICD-1); the trailing comment records
# the human-readable version. Update the SHA and comment together when bumping.
jobs:
  test:
    name: Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-fund
        env:
          NPM_CONFIG_LOGLEVEL: error

      # Fail the build on newly-disclosed high/critical CVEs in production deps
      # (audit DEP-2). Dev-only advisories are excluded via --omit=dev.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm test -- --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Build (esbuild)
        run: npm run build

      - name: Verify binary starts
        run: node dist/index.js 2>&1 | grep -q "AZURE_CLIENT_ID" && echo "Binary OK"
