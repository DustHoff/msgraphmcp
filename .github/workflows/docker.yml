name: Docker — Build & Push to GHCR

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:

# Opt into Node.js 24 for all actions (avoids the Node.js 20 deprecation warning)
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Actions are pinned to commit SHAs (audit CICD-1); the trailing comment records
# the human-readable version. Update the SHA and comment together when bumping.
jobs:
  test:
    name: Tests (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-fund
        env:
          NPM_CONFIG_LOGLEVEL: error
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test -- --forceExit

  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # ── Lowercase image name ──────────────────────────────────────────────
      # OCI references must be lowercase, but github.repository preserves the
      # owner's casing (e.g. DustHoff/...). cosign's strict reference parser
      # rejects uppercase, so derive a lowercase name once and reuse it for the
      # metadata, attestation, and cosign steps below.
      - name: Lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      # ── Build JS bundle natively (avoids esbuild crashing under QEMU) ──────
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"
      - name: Install & bundle
        run: npm ci --no-fund --silent && npm run build
        env:
          NPM_CONFIG_LOGLEVEL: error

      # ── Multi-platform builder ─────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # ── Auth ──────────────────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Tags & Labels ─────────────────────────────────────────────────────
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            # latest on every push to main
            type=raw,value=latest,enable={{is_default_branch}}
            # semver tags: v1.2.3 → 1.2.3 and 1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # short sha for traceability
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=msgraphmcp
            org.opencontainers.image.description=MCP Server for Microsoft Graph API (delegated permissions)
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      # ── Build & Push (with SBOM + provenance attestations) ─────────────────
      - name: Build and push
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Generate an SBOM and max-level provenance attestation (audit CICD-2)
          sbom: true
          provenance: mode=max

      # ── Provenance attestation ────────────────────────────────────────────
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # ── Keyless signature (Sigstore/cosign, OIDC) ─────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the published image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME_LC}@${DIGEST}"
