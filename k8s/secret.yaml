# IMPORTANT: Replace the placeholder values before applying.
# Generate base64 values with:   echo -n 'your-value' | base64
#
# Do NOT commit real credentials to version control.
# Use a secret manager (Sealed Secrets, External Secrets Operator, Vault) in production.
apiVersion: v1
kind: Secret
metadata:
  name: msgraphmcp-azure
  namespace: msgraphmcp
  labels:
    app.kubernetes.io/name: msgraphmcp
    app.kubernetes.io/component: credentials
type: Opaque
data:
  # Required: Azure App Registration client ID
  AZURE_CLIENT_ID: REPLACE_WITH_BASE64_CLIENT_ID
  # Required: pin to your tenant ID for a public deployment. Avoid "common"
  # (multi-tenant), which accepts logins from arbitrary tenants (audit AUTH-6).
  AZURE_TENANT_ID: REPLACE_WITH_BASE64_TENANT_ID
  # ── Authorization-code mode credentials (required for public / HTTP) ───────
  # Client secret for the confidential client used by the authorization-code flow.
  # Rotate periodically; prefer a secret manager (Sealed Secrets / ESO / Vault).
  AZURE_CLIENT_SECRET: REPLACE_WITH_BASE64_CLIENT_SECRET
  #
  # Inbound auth gate for /mcp: a high-entropy bearer token the MCP client
  # (Claude Code) presents on every request. Generate with:
  #   openssl rand -hex 32 | base64
  MCP_AUTH_TOKEN: REPLACE_WITH_BASE64_MCP_AUTH_TOKEN
  #
  # NOTE: app-only client-certificate auth is intentionally NOT configured here.
  # The server refuses app-only / device-code auth over HTTP (audit AUTH-1 / AUTH-4);
  # those modes are for local stdio use only.
