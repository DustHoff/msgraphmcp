apiVersion: apps/v1
kind: Deployment
metadata:
  name: msgraphmcp
  namespace: msgraphmcp
  labels:
    app.kubernetes.io/name: msgraphmcp
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: msgraphmcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: msgraphmcp
        app.kubernetes.io/version: "1.0.0"
    spec:
      # ── ARM64 node placement ──────────────────────────────────────────────
      nodeSelector:
        kubernetes.io/arch: arm64

      # If your arm64 nodes carry a dedicated taint, add a matching toleration.
      # Common examples (uncomment the one that matches your cluster):
      tolerations:
        - key: "kubernetes.io/arch"
          operator: "Equal"
          value: "arm64"
          effect: "NoSchedule"
        # - key: "node-role.kubernetes.io/arm"
        #   operator: "Exists"
        #   effect: "NoSchedule"

      # ── Security ──────────────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000        # matches the `node` user in node:20-alpine
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: msgraphmcp
          image: ghcr.io/dusthoff/msgraphmcp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            # Enable HTTP transport (Kubernetes mode)
            - name: PORT
              value: "8080"
            - name: TOKEN_CACHE_PATH
              value: /data/tokens.json
            - name: NODE_ENV
              value: production
            # Production logging defaults: warn level and no Graph request/response
            # body logging. GRAPH_DEBUG defaults ON in code and would otherwise log
            # full Graph payloads incl. PII / Intune encryption keys (audit LOG-1/LOG-2).
            - name: LOG_LEVEL
              value: warn
            - name: GRAPH_DEBUG
              value: "false"
            # Azure credentials from Secret
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: msgraphmcp-azure
                  key: AZURE_CLIENT_ID
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: msgraphmcp-azure
                  key: AZURE_TENANT_ID
            # ── Auth mode: Authorization Code + PKCE (delegated, per-user) ──
            # This is the ONLY mode permitted for public / HTTP exposure. The server
            # refuses to start in app-only (client-secret / client-certificate) or
            # device-code mode over HTTP unless MCP_ALLOW_INSECURE_AUTH_MODE=true
            # (audit findings AUTH-1 / AUTH-4).
            #
            # Register https://<your-host>/auth/callback as a redirect URI in Entra ID.
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: msgraphmcp-azure
                  key: AZURE_CLIENT_SECRET
            - name: AZURE_REDIRECT_URI
              value: https://msgraph.os.hoffnet.onesi.de/auth/callback

            # ── Inbound auth gate for /mcp (audit CSRF-1 / AUTH-1) ───────────
            # High-entropy bearer token required on every /mcp request, so only
            # authorized MCP clients can open a session or obtain a login URL.
            # Generate with: openssl rand -hex 32
            # Configure Claude Code (the MCP client) with:
            #   claude mcp add --transport http msgraphmcp \
            #       https://msgraph.os.hoffnet.onesi.de/mcp \
            #       --header "Authorization: Bearer <token>"
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: msgraphmcp-azure
                  key: MCP_AUTH_TOKEN

          volumeMounts:
            - name: token-cache
              mountPath: /data
            # Uncomment for Option B (client certificate):
            # - name: client-cert
            #   mountPath: /mnt/cert
            #   readOnly: true

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # ── Probes ─────────────────────────────────────────────────────────
          # start-period covers the one-time device-code authentication flow
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60    # 60 × 5 s = 5 min for first auth
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # false because npm writes to node_modules at runtime
            capabilities:
              drop:
                - ALL

      volumes:
        - name: token-cache
          persistentVolumeClaim:
            claimName: msgraphmcp-token-cache
        # Uncomment for Option B (client certificate).
        # Create a Kubernetes Secret named "msgraphmcp-client-cert" containing
        # the PEM private key under the key "tls.key", then uncomment below:
        # - name: client-cert
        #   secret:
        #     secretName: msgraphmcp-client-cert
        #     defaultMode: 0400

      restartPolicy: Always
